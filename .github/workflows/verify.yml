name: Verify ERP
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start native PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER erp WITH PASSWORD 'ephemeral_ci_only';"
          sudo -u postgres createdb -O erp erp_test
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://erp:ephemeral_ci_only@localhost:5432/erp_test
      - run: python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql+psycopg://erp:ephemeral_ci_only@localhost:5432/erp_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/*.test.cjs
      - run: npm run build
